<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://code.responsivevoice.org/responsivevoice.js?key=DHDZACSR"></script>
</head>
<body>
<h1>Jarvis AI Assistant</h1>
<input type="text" id="question" placeholder="Ask me something...">
<button onclick="askJarvis()">Ask</button>
<p id="answer"></p>

<script>
async function askJarvis() {
    const question = document.getElementById('question').value;
    if(!question) return;

    const res = await fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question})
    });

    const data = await res.json();
    document.getElementById('answer').innerText = data.answer;

    // Speak answer using ResponsiveVoice
    responsiveVoice.speak(data.answer, "Hindi Male");
}
</script>
